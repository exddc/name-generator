name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_JWT_SECRET: ci-only-api-jwt-secret-at-least-32-bytes
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-bytes
  BETTER_AUTH_URL: http://127.0.0.1:3100
  GROQ_VALIDATE_MODEL_ON_STARTUP: "false"
  NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
  NEXT_PUBLIC_BETTER_AUTH_URL: http://127.0.0.1:3100
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  # Keep in sync with scripts/verify.sh defaults
  BUN_VERSION: "1.3.0"
  PYTHON_VERSION: "3.12.13"
  POETRY_VERSION: "1.8.5"

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: bun run lint

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      - name: Build
        working-directory: apps/web
        run: bun run build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Browser contract (baseline)
        working-directory: apps/web
        run: bun run test:e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_POSTGRES_INTEGRATION_TEST: "1"
      RUN_REDIS_INTEGRATION_TEST: "1"
      REDIS_URL: redis://127.0.0.1:6379/15
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:password@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          pipx install poetry==${{ env.POETRY_VERSION }}
          pipx inject poetry poetry-plugin-export==1.8.0

      - name: Cache API virtualenv
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: apps/api/.venv
          key: poetry-api-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('apps/api/poetry.lock') }}
          restore-keys: |
            poetry-api-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install API dependencies
        working-directory: apps/api
        run: poetry install --no-interaction --no-ansi

      - name: Unit tests
        working-directory: apps/api
        run: poetry run pytest -q -m "not integration"

      - name: Integration tests (Postgres + Redis)
        working-directory: apps/api
        run: poetry run pytest -q -m integration

  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          pipx install poetry==${{ env.POETRY_VERSION }}
          pipx inject poetry poetry-plugin-export==1.8.0

      - name: Cache worker virtualenv
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: apps/worker/.venv
          key: poetry-worker-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('apps/worker/poetry.lock') }}
          restore-keys: |
            poetry-worker-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install worker dependencies
        working-directory: apps/worker
        run: poetry install --no-interaction --no-ansi

      - name: Unit tests
        working-directory: apps/worker
        run: poetry run pytest -q

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          pipx install poetry==${{ env.POETRY_VERSION }}
          pipx inject poetry poetry-plugin-export==1.8.0

      - name: Cache Bun install
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache API virtualenv
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: apps/api/.venv
          key: poetry-api-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('apps/api/poetry.lock') }}
          restore-keys: |
            poetry-api-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Cache worker virtualenv
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: apps/worker/.venv
          key: poetry-worker-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('apps/worker/poetry.lock') }}
          restore-keys: |
            poetry-worker-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Web dependency audit
        working-directory: apps/web
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high

      - name: API dependency audit
        working-directory: apps/api
        run: |
          poetry install --no-interaction --no-ansi
          poetry export --without-hashes --without dev | pipx run pip-audit==2.10.1 -r /dev/stdin

      - name: Worker dependency audit
        working-directory: apps/worker
        run: |
          poetry install --no-interaction --no-ansi
          poetry export --without-hashes --without dev | pipx run pip-audit==2.10.1 -r /dev/stdin

      - name: Compose and Dockerfile checks
        env:
          GROQ_API_KEY: ci-placeholder
        run: |
          docker compose --profile infra --profile backend --profile frontend config --quiet
          docker build --check apps/api
          docker build --check apps/worker
          docker build --check apps/web

      - name: Scan secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-version: 0.72.0
          scanners: misconfig,secret
          skip-dirs: apps/web/node_modules,apps/api/.venv,apps/worker/.venv
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Single required check for branch protection / rulesets.
  required:
    name: CI required
    if: always()
    needs: [web, api, worker, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce all gates green
        run: |
          echo "web=${{ needs.web.result }}"
          echo "api=${{ needs.api.result }}"
          echo "worker=${{ needs.worker.result }}"
          echo "supply-chain=${{ needs.supply-chain.result }}"
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.api.result }}" = "success"
          test "${{ needs.worker.result }}" = "success"
          test "${{ needs.supply-chain.result }}" = "success"
